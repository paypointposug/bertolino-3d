<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>le Fleur – Matcha-Laden in 3D</title>
<link rel="icon" href="data:,">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: ruhig, hell, wie ein frisch gestrichener Raum
   IDEA: begehbares Modell – der Raum selbst ist das Bild
   PICTURE: der 3D-Raum füllt den ganzen Schirm
   COLOUR and TYPE: Weiß/Mattglas, Tinte #1d2321, Inter
   LAYOUT: Name oben links, Ansichten unten mittig, Hinweis darüber */
:root{color-scheme:light;--ink:#1d2321;--glass:rgba(255,255,255,.72);--line:rgba(29,35,33,.12)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#eceeed;font:15px/1.4 Inter,system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.chip{position:fixed;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:8px 14px 9px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.chip b{font:400 26px/1 Sacramento,cursive;display:block;margin-bottom:1px}
.chip span{font-size:12px;opacity:.65}
#views{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.08);max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none}
#views button{font:600 14px/1 Inter,system-ui,sans-serif;color:var(--ink);background:transparent;border:0;border-radius:11px;min-height:44px;padding:0 14px;white-space:nowrap;cursor:pointer}
#views button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}
#views button:focus-visible{outline:2px solid #6b8f84;outline-offset:1px}
#hint{position:fixed;left:50%;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 66px);transform:translateX(-50%);background:rgba(29,35,33,.78);color:#fff;border-radius:12px;padding:10px 14px;font-size:13.5px;text-align:center;max-width:min(92vw,520px);transition:opacity .5s;pointer-events:none}
#hint.gone{opacity:0}
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.28);border:1.5px solid rgba(255,255,255,.75);box-shadow:0 2px 14px rgba(0,0,0,.12);display:none;pointer-events:none}
#joy i{position:absolute;left:38px;top:38px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.dim{position:fixed;left:0;top:0;display:none;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12.5px;font-weight:600;white-space:nowrap;pointer-events:none;box-shadow:0 2px 10px rgba(0,0,0,.08)}
#note{position:fixed;right:max(14px,env(safe-area-inset-right));top:calc(max(14px,env(safe-area-inset-top)) + 58px);font-size:12px;background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:none}
body.top #note{display:block}
#load{position:fixed;inset:0;display:grid;place-items:center;background:#eceeed;transition:opacity .6s;font-size:14px;opacity:1}
body.ready #load{opacity:0;pointer-events:none}
#look{position:fixed;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));display:flex;gap:3px;padding:4px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
#look button{font:600 13.5px/1 Inter,system-ui,sans-serif;color:var(--ink);background:transparent;border:0;border-radius:10px;min-height:40px;padding:0 12px;white-space:nowrap;cursor:pointer}
#look button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}
#look button[data-l=matcha].on{background:#5f7d45;color:#fff}
#listBtn{position:fixed;left:max(14px,env(safe-area-inset-left));top:calc(max(14px,env(safe-area-inset-top)) + 70px);display:none;font:600 13.5px/1 Inter,system-ui,sans-serif;color:var(--ink);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;min-height:40px;padding:0 13px;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.06)}
#listBtn b{color:#4b6636}
body.matcha.haslist #listBtn{display:block}
#sheet{position:fixed;right:max(14px,env(safe-area-inset-right));top:calc(max(14px,env(safe-area-inset-top)) + 58px);bottom:calc(max(16px,env(safe-area-inset-bottom)) + 66px);width:min(400px,calc(100vw - 28px));background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.14);display:none;flex-direction:column;overflow:hidden;touch-action:pan-y;user-select:text;-webkit-user-select:text}
#sheet.open{display:flex}
#sheet header{padding:14px 16px 10px;border-bottom:1px solid var(--line);position:relative}
#sheet header b{font-size:16px;display:block}
#sheet header span{font-size:12.5px;opacity:.65}
#sheetX{position:absolute;right:8px;top:8px;width:40px;height:40px;border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;color:var(--ink);border-radius:10px}
#sheetBody{overflow-y:auto;padding:4px 16px 8px;-webkit-overflow-scrolling:touch}
#sheetBody h3{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.55;margin:14px 0 4px}
.row{display:grid;grid-template-columns:26px 1fr auto;gap:6px;padding:7px 0;border-bottom:1px solid rgba(29,35,33,.07);font-size:13.5px;align-items:start}
.row .n{font-weight:600;opacity:.7}
.row .nm a{display:block;font-size:11.5px;color:#4b6636;text-decoration:none;margin-top:2px}
.row .p{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
#sheet footer{padding:10px 16px 14px;border-top:1px solid var(--line);font-size:13px}
#sheet footer .tot{display:flex;justify-content:space-between;font-size:16px;font-weight:600;margin-bottom:2px}
#sheet footer .r{display:flex;justify-content:space-between;opacity:.7}
#sheet footer p{margin-top:8px;font-size:12px;opacity:.65;line-height:1.45}
@media (max-width:560px){#sheet{left:10px;right:10px;width:auto;top:auto;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 62px);max-height:66vh}}
@media (max-width:420px){#look button{padding:0 9px;font-size:13px}#views{gap:2px;padding:4px}#views button{padding:0 9px;font-size:13px}.chip b{font-size:23px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="chip"><b>le Fleur</b><span id="sub">Gastraum · Matcha-Entwurf</span></div>
<div id="look" role="group" aria-label="Ansicht"><button data-l="leer">Jetzt</button><button data-l="matcha" class="on">Matcha-Laden</button></div>
<button id="listBtn" type="button">Einkaufsliste · <b id="listSum"></b></button>
<aside id="sheet" aria-label="Einkaufsliste">
  <header><b>Einkaufsliste Gastraum</b><span id="sheetSub"></span><button id="sheetX" type="button" aria-label="Schließen">×</button></header>
  <div id="sheetBody"></div>
  <footer><div class="tot"><span>Summe</span><span id="sum"></span></div><div class="r"><span>Rest vom Budget</span><span id="rest"></span></div>
  <p id="sheetNote"></p></footer>
</aside>
<div id="note">Maße geschätzt</div>
<nav id="views" aria-label="Ansichten">
  <button data-v="fenster" class="on">Fenster</button>
  <button data-v="eingang">Eingang</button>
  <button data-v="bogen">Bogen</button>
  <button data-v="wand">Wand</button>
  <button data-v="oben">Von oben</button>
</nav>
<div id="hint"><span class="t"></span></div>
<div id="joy"><i></i></div>
<div id="load">Raum wird geladen …</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module" src="room.js?v=20261124m8"></script>
</body>
</html>
